apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: sandbox-svc
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: worker
    ports:
    - protocol: TCP
      port: 50051 # gRPC port for sandbox execution
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8 # Block access to internal VPC network
    ports:
    - protocol: TCP
      port: 443 # Allow HTTPS out for downloading datasets/models
    - protocol: TCP
      port: 80 # Allow HTTP out
