apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-papertoprod
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  engineering-ops.json: |-
    {
      "title": "Engineering Ops",
      "panels": [
        {
          "title": "API Request Latency",
          "type": "graph",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "title": "GPU Utilization (Worker Pool)",
          "type": "gauge",
          "targets": [
            {
              "expr": "avg(DCGM_FI_DEV_GPU_UTIL)",
              "legendFormat": "GPU Util %"
            }
          ]
        },
        {
          "title": "Celery Queue Depth",
          "type": "stat",
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready{queue=\"celery\"}",
              "legendFormat": "Ready Jobs"
            }
          ]
        }
      ]
    }
  product-metrics.json: |-
    {
      "title": "Product Metrics",
      "panels": [
        {
          "title": "Reproduction Success Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(papertoprod_job_status_total{status=\"completed\"}[1d])) / sum(rate(papertoprod_job_status_total[1d])) * 100",
              "legendFormat": "Success Rate %"
            }
          ]
        },
        {
          "title": "Fidelity Score Distribution",
          "type": "heatmap",
          "targets": [
            {
              "expr": "sum(rate(papertoprod_job_fidelity_score_bucket[1d])) by (le)",
              "legendFormat": "{{le}}"
            }
          ]
        }
      ]
    }
