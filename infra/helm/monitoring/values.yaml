# infra/helm/monitoring/values.yaml
kube-prometheus-stack:
  grafana:
    enabled: true
    defaultDashboardsEnabled: true
    adminPassword: "prom-operator"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

  # Alertmanager configuration
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['job']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'slack'
        routes:
        - match:
            alertname: QueueDepthHigh
          receiver: 'slack'
      receivers:
      - name: 'slack'
        # Slack configuration would go here
