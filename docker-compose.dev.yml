# Docker Compose — Development Environment
# Mirrors production service topology at small scale

services:
  # ── Core Application ──────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://papertoprod:papertoprod@postgres:5432/papertoprod
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://papertoprod:papertoprod@postgres:5432/papertoprod
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - SANDBOX_SERVICE_URL=http://sandbox-svc:8001
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    volumes:
      - ./apps/worker:/app
    command: celery -A celery_app worker --loglevel=info

  sandbox-svc:
    build:
      context: ./apps/sandbox-svc
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apps/sandbox-svc:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # ── Data Stores ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: papertoprod
      POSTGRES_USER: papertoprod
      POSTGRES_PASSWORD: papertoprod
    volumes:
      - .postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - .redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - .qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - .minio-data:/data
    command: server /data --console-address ":9001"
